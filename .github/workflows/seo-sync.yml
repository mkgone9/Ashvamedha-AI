name: Site sync (index, hubs, llms.txt, sitemap) + IndexNow
on:
  push:
    branches: [main]
    paths:
      - 'blog/**'
      - 'te/**'
      - 'scripts/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild blog index, hubs, Telugu index, llms.txt, sitemap
        run: python3 scripts/site_sync.py
      - name: Commit generated files
        run: |
          git config user.name 'Ashvamedha SEO Sync'
          git config user.email 'actions@users.noreply.github.com'
          git add -A blog.html guides te llms.txt sitemap.xml blog
          git diff --cached --quiet && exit 0
          git commit -m 'Site sync: index, hubs, llms.txt, sitemap [skip ci]'
          git push
      - name: Ping IndexNow (Bing, Yandex, Seznam — feeds ChatGPT/Copilot search)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, subprocess, urllib.request
          SITE='https://www.ashvamedhaai.com'; KEY='9988130551fac33655201e28196dfbaa'
          files = subprocess.run(['git','diff','--name-only','HEAD~1','HEAD'],capture_output=True,text=True).stdout.split()
          urls = {SITE+'/blog', SITE+'/te', SITE+'/llms.txt', SITE+'/sitemap.xml'}
          for f in files:
              if f.endswith('.html') and (f.startswith('blog/') or f.startswith('te/')):
                  urls.add(SITE+'/'+f[:-5])
          body = json.dumps({'host':'www.ashvamedhaai.com','key':KEY,'keyLocation':f'{SITE}/{KEY}.txt','urlList':sorted(urls)[:10000]}).encode()
          req = urllib.request.Request('https://api.indexnow.org/indexnow', data=body, headers={'Content-Type':'application/json; charset=utf-8'})
          print(urllib.request.urlopen(req, timeout=30).status, len(urls), 'urls')
          PY
