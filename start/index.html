<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tell Manoj About You — Ashvamedha Finance</title>
<meta name="description" content="A 1-minute form so Manoj Kumar understands your goals before you talk: retirement, investments, guaranteed income, life cover, kids and parents.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://www.ashvamedhaai.com/start">
<meta name="theme-color" content="#fbfaf7">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
/* Layout: 4-step horizontal tracker; each step is a short list of tap-to-open rows ("drops"). */
:root{
  --paper:#fbfaf7;--card:#fff;--ink:#0b1730;--sub:#5d6778;--line:#e8e4dc;--soft:#f3f0e9;
  --gold:#c49a3c;--green:#13915a;--green-soft:#e6f6ee;--blue:#2458d6;--blue-soft:#eaf0fd;--coral:#e2674a;
  --body:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;--serif:'Instrument Serif',Georgia,serif;
}
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
body{font-family:var(--body);background:var(--paper);color:var(--ink);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px}
.g{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:600px;margin:0 auto}
/* header + tracker */
.top{position:sticky;top:0;z-index:20;background:rgba(251,250,247,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding-block:10px 6px;text-decoration:none;color:inherit}
.logo{width:32px;height:32px;border-radius:9px;background:var(--ink);color:#e8c878;display:grid;place-items:center;font-weight:800;font-size:12.5px}
.brand b{display:block;font-size:13px;letter-spacing:.04em}
.brand span{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
.track{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding-block:6px 12px;position:relative}
.tstep{border:0;background:none;cursor:pointer;display:grid;justify-items:center;gap:5px;padding:0;position:relative;z-index:1}
.tstep .d{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;background:var(--card);border:2px solid var(--line);color:var(--sub);transition:all .2s}
.tstep .t{font-size:12.5px;font-weight:700;color:var(--sub)}
.tstep.on .d{background:var(--ink);border-color:var(--ink);color:#fff}
.tstep.on .t{color:var(--ink)}
.tstep.done .d{background:var(--green);border-color:var(--green);color:#fff}
.rail{position:absolute;left:12.5%;right:12.5%;top:21px;height:2px;background:var(--line)}
.rail i{display:block;height:100%;background:var(--green);transition:width .3s}
/* step */
.step{padding-block:18px 10px;animation:rise .3s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.step,.drop{animation:none}}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(30px,8vw,38px);line-height:1.08;text-wrap:balance}
h1 em{color:var(--green)}
.lead{color:var(--sub);margin-top:6px;font-size:15px}
.stack{display:grid;gap:18px;margin-top:20px}
.f{display:grid;gap:8px;min-width:0}
.l{font-weight:700;font-size:15px}
.l small{font-weight:500;color:var(--sub);font-size:13px;margin-left:4px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;line-height:1.2}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.tx{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px;outline:none}
.tx:focus{border-color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.two>*{min-width:0}
.stepper{display:flex;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:3px;width:max-content;max-width:100%}
.stepper button{width:38px;height:38px;border-radius:10px;border:0;background:var(--soft);font-size:19px;font-weight:700;cursor:pointer}
.stepper input{width:54px;border:0;text-align:center;font-size:19px;font-weight:800;background:transparent;outline:none;font-variant-numeric:tabular-nums}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;font-size:15px}
.toggle input{width:20px;height:20px;accent-color:var(--ink)}
/* rows with drops */
.rows{display:grid;gap:10px}
.row{background:var(--card);border:1.5px solid var(--line);border-radius:18px;overflow:hidden;transition:border-color .2s,box-shadow .2s}
.row.on{border-color:var(--ink);box-shadow:0 8px 22px rgba(11,23,48,.07)}
.rh{width:100%;border:0;background:none;display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;text-align:left}
.rh i{font-style:normal;flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:21px;background:var(--soft)}
.row.on .rh i{background:var(--c,var(--soft))}
.rh div{flex:1;min-width:0}
.rh b{display:block;font-size:15.5px;line-height:1.25}
.rh span{display:block;font-size:13px;color:var(--sub);line-height:1.35;overflow:hidden;text-overflow:ellipsis}
.row.on .rh span{color:var(--green);font-weight:600}
.box{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:transparent;font-weight:800}
.row.on .box{background:var(--ink);border-color:var(--ink);color:#fff}
.drop{padding:2px 14px 16px;display:grid;gap:14px;border-top:1px dashed var(--line);margin:0 14px;padding-inline:0;padding-top:14px;animation:open .25s ease both}
@keyframes open{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.est{background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;font-size:14px;display:grid;gap:2px}
.est b{font-size:18px}.est small{color:#b9c3d6;font-size:11.5px}
.note{font-size:13px;color:var(--sub)}
.note a{color:var(--blue);font-weight:700;text-decoration:none}
.kids{display:flex;flex-wrap:wrap;gap:8px}
.kid{display:flex;align-items:center;gap:6px;background:var(--soft);border-radius:12px;padding:6px 10px;font-size:13px;color:var(--sub)}
.kid input{width:42px;border:0;background:#fff;border-radius:8px;padding:5px;text-align:center;font-weight:700;font-size:15px;outline:none}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--sub)}
.consent input{width:20px;height:20px;margin-top:1px;flex:none;accent-color:var(--green)}
.err{color:var(--coral);font-size:13.5px;font-weight:600}
.fine{font-size:11.5px;color:var(--sub);line-height:1.6}
.copy{background:none;border:0;color:var(--blue);font-weight:700;font-size:13.5px;cursor:pointer;padding:0;text-align:left}
textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit;font-size:13px;margin-top:8px}
/* bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px))}
.bar-in{display:flex;gap:8px}
.btn{border-radius:14px;padding:13px 16px;font-weight:700;font-size:15px;cursor:pointer;border:1.5px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.main{flex:1;background:var(--ink);border-color:var(--ink);color:#fff}
.btn.wa{flex:1;background:#1f9d55;border-color:#1f9d55;color:#fff}
.btn.wa[aria-disabled=true]{opacity:.45;pointer-events:none}
.btn.ghost{border-color:transparent;background:none;color:var(--sub)}
@media (max-width:360px){.two{grid-template-columns:1fr}.tstep .t{font-size:11px}}
</style>
</head>
<body>
<header class="top"><div class="wrap g">
  <a class="brand" href="/"><div class="logo">AF</div><div><b>MANOJ KUMAR</b><span>Ashvamedha Finance</span></div></a>
  <nav class="track" id="track" aria-label="Steps"><div class="rail"><i id="railFill"></i></div></nav>
</div></header>
<main class="wrap g" id="stage"></main>
<div class="bar"><div class="wrap g bar-in">
  <button class="btn" id="back" type="button" aria-label="Back">←</button>
  <button class="btn ghost" id="skip" type="button">Skip</button>
  <button class="btn main" id="next" type="button">Next →</button>
  <a class="btn wa" id="send" href="#" target="_blank" rel="noopener" aria-disabled="true" hidden>Send to Manoj on WhatsApp</a>
</div></div>

<script>
(function(){
const $=id=>document.getElementById(id),WA='918790109022',KEY='ashv-start-v2';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const L=n=>n>=1e7?'₹'+(n/1e7).toFixed(2).replace(/\.?0+$/,'')+' Cr':n>=1e5?'₹'+(n/1e5).toFixed(1).replace(/\.0$/,'')+' L':'₹'+Math.round(n).toLocaleString('en-IN');
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
let S={v:{},sel:{},step:0,done:{}};
try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&d.v)S=Object.assign(S,d)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const V=k=>S.v[k];

/* building blocks */
const chips=(k,opts)=>`<div class="chips">${opts.map(o=>`<button type="button" class="chip" data-k="${k}" data-v="${esc(o)}" aria-pressed="${V(k)===o}">${esc(o)}</button>`).join('')}</div>`;
const F=(label,inner,sub)=>`<div class="f"><div class="l">${label}${sub?`<small>${sub}</small>`:''}</div>${inner}</div>`;
const num=(k,def,min,max)=>`<div class="stepper"><button type="button" data-step="${k}" data-d="-1" data-min="${min}" data-max="${max}" data-def="${def}" aria-label="Less">−</button><input data-num="${k}" inputmode="numeric" value="${V(k)??''}" placeholder="${def}" aria-label="${k}"><button type="button" data-step="${k}" data-d="1" data-min="${min}" data-max="${max}" data-def="${def}" aria-label="More">+</button></div>`;

/* rows: each opens a "drop" when selected */
const ROWS={
 family:[
  {id:'spouse',ic:'💑',c:'#fde8ec',t:'Spouse',d:'Husband or wife',body:()=>`<div class="two">${F('Their age',num('spAge',30,18,85))}${F('Do they earn?',chips('spEarn',['Yes','No']))}</div>`,sum:()=>[V('spAge')&&V('spAge')+' yrs',V('spEarn')==='Yes'&&'earns'].filter(Boolean).join(' · ')},
  {id:'kids',ic:'🧒',c:'#e9f3ff',t:'Children',d:'Add their ages',body:()=>F('How many?',chips('kidsN',['1','2','3','4']))+(V('kidsN')?`<div class="kids">${Array.from({length:+V('kidsN')},(_,i)=>`<label class="kid">Child ${i+1}<input data-kid="${i}" inputmode="numeric" value="${esc((V('kidAges')||[])[i]??'')}" placeholder="age"></label>`).join('')}</div>`:''),sum:()=>V('kidsN')?`${V('kidsN')} · ages ${(V('kidAges')||[]).filter(Boolean).join(', ')||'–'}`:''},
  {id:'parents',ic:'👵',c:'#fff3dc',t:'Parents',d:'Yours or your spouse\'s',body:()=>`<div class="two">${F('Older parent\'s age',num('parAge',60,40,100))}${F('Depend on you?',chips('parDep',['Fully','Partly','No']))}</div>`,sum:()=>[V('parAge')&&V('parAge')+' yrs',V('parDep')&&'depend: '+V('parDep').toLowerCase()].filter(Boolean).join(' · ')}],
 goals:[
  {id:'retire',ic:'🏝️',c:'#e2f6ec',t:'Retirement',d:'How much to invest for a monthly income later',
   body:()=>`<div class="two">${F('Retire at',num('retAge',55,35,75))}${F('For how long?',chips('retYrs',['20 yrs','25 yrs','30 yrs']))}</div>`+F('Monthly income you\'ll need',chips('retNeed',['₹30k','₹50k','₹75k','₹1 L','₹2 L+']),'today\'s value')+`<div id="est">${estHTML()}</div>`,
   sum:()=>V('retNeed')?`at ${V('retAge')??55} · ${V('retNeed')}/mo · ${V('retYrs')||'25 yrs'}`:''},
  {id:'wealth',ic:'📈',c:'#eaf0fd',t:'Grow my wealth',d:'Mutual funds & SIPs for a goal',
   body:()=>F('Growing it for',chips('wFor',['A house','Financial freedom','Just growing it','Other']))+F('In about',chips('wYrs',['3–5 yrs','5–10 yrs','10+ yrs'])),
   sum:()=>[V('wFor'),V('wYrs')].filter(Boolean).join(' · ')},
  {id:'guaranteed',ic:'🔒',c:'#f1ecfd',t:'Guaranteed income',d:'Fixed income markets can\'t change',
   body:()=>F('Can set aside every year',chips('gAmt',['₹1 L','₹2–3 L','₹5 L','₹10 L+']),'for ~10 years')+F('Income should start',chips('gStart',['In 10 yrs','In 15 yrs','At retirement']))+`<p class="note">See sample numbers: <a href="/insurance/guaranteed-income/10-pay-30-year-income" target="_blank" rel="noopener">guaranteed income calculator →</a></p>`,
   sum:()=>[V('gAmt')&&V('gAmt')+'/yr',V('gStart')].filter(Boolean).join(' · ')},
  {id:'life',ic:'🛡️',c:'#e9f3ff',t:'Life insurance',d:'Protect my family',
   body:()=>F('Cover you\'re thinking of',chips('lAmt',['Help me decide','₹1 Cr','₹2 Cr','₹3 Cr+']))+F('Do you use tobacco?',chips('smoke',['No','Yes']),'changes the price'),
   sum:()=>[V('lAmt'),V('smoke')==='Yes'&&'tobacco'].filter(Boolean).join(' · ')},
  {id:'kidsGoal',ic:'🎓',c:'#fff3dc',t:'Children\'s future',d:'Education or marriage fund',
   body:()=>F('Planning for',chips('kGoal',['Education','Study abroad','Marriage']))+F('Needed in',chips('kWhen',['Under 5 yrs','5–10 yrs','10+ yrs'])),
   sum:()=>[V('kGoal'),V('kWhen')].filter(Boolean).join(' · ')},
  {id:'parentsGoal',ic:'🤲',c:'#fde8ec',t:'Income for my parents',d:'Monthly support or help them retire',
   body:()=>F('They need every month',chips('pNeed',['₹15k','₹25k','₹40k','₹60k+']))+F('From',chips('pWhen',['Now','In 1–3 yrs','In 5+ yrs'])),
   sum:()=>[V('pNeed')&&V('pNeed')+'/mo',V('pWhen')].filter(Boolean).join(' · ')}],
 have:[
  {id:'hMF',ic:'📊',c:'#eaf0fd',t:'Mutual funds',d:'Current value',body:()=>chips('mf',['Under ₹1 L','₹1–5 L','₹5–25 L','₹25 L–1 Cr','₹1 Cr+']),sum:()=>V('mf')||''},
  {id:'hStk',ic:'📈',c:'#e2f6ec',t:'Stocks',d:'Current value',body:()=>chips('stk',['Under ₹1 L','₹1–5 L','₹5–25 L','₹25 L–1 Cr','₹1 Cr+']),sum:()=>V('stk')||''},
  {id:'hSafe',ic:'🏦',c:'#fff3dc',t:'FD / PPF / EPF',d:'All together',body:()=>chips('safe',['Under ₹1 L','₹1–5 L','₹5–25 L','₹25 L–1 Cr','₹1 Cr+']),sum:()=>V('safe')||''},
  {id:'hIns',ic:'🛡️',c:'#e9f3ff',t:'Insurance I already have',d:'Term, LIC, ULIP…',body:()=>F('Life / term cover',chips('term',['None','Under ₹50 L','₹50 L–1 Cr','₹1 Cr+']))+F('Savings policies',chips('pol',['None','LIC / endowment','ULIP','Both'])),sum:()=>[V('term')&&'cover '+V('term'),V('pol')&&V('pol')!=='None'&&V('pol')].filter(Boolean).join(' · ')},
  {id:'hLoan',ic:'🏠',c:'#fde8ec',t:'Loans / EMIs',d:'Home, car, personal',body:()=>F('Total EMI per month',chips('emi',['Under ₹10k','₹10–25k','₹25–50k','₹50k+'])),sum:()=>V('emi')?'EMI '+V('emi'):''}]
};
const rowsHTML=group=>`<div class="rows">${ROWS[group].map(r=>{const on=!!S.sel[r.id],s=on&&r.sum();return `<div class="row ${on?'on':''}" style="--c:${r.c}"><button type="button" class="rh" data-row="${r.id}" aria-expanded="${on}"><i>${r.ic}</i><div><b>${r.t}</b><span>${esc(s||r.d)}</span></div><span class="box">${on?'✓':''}</span></button>${on?`<div class="drop">${r.body()}</div>`:''}</div>`}).join('')}</div>`;

/* retirement estimate: transparent assumptions */
const MID={'Under ₹1 L':50000,'₹1–5 L':300000,'₹5–25 L':1500000,'₹25 L–1 Cr':6000000,'₹1 Cr+':15000000};
const NEED={'₹30k':30000,'₹50k':50000,'₹75k':75000,'₹1 L':100000,'₹2 L+':200000};
function retire(){const age=V('age'),R=V('retAge')??55,M=NEED[V('retNeed')],Z=parseInt(V('retYrs')||'25',10);
  if(!age||!M||R<=age)return null;const n=R-age,need1=M*12*Math.pow(1.06,n),q=1.06/1.07,corpus=need1*(1-Math.pow(q,Z))/0.01*1.07;
  const have=((MID[V('mf')]||0)+(MID[V('stk')]||0)+(MID[V('safe')]||0))*Math.pow(1.1,n),gap=Math.max(0,corpus-have);
  const m=Math.pow(1.1,1/12)-1,sip=gap/(((Math.pow(1+m,n*12)-1)/m)*(1+m));return{corpus,sip:Math.ceil(sip/500)*500,gap,R}}
function estHTML(){const r=retire();if(!r)return `<p class="note">${V('age')?'Pick a monthly amount to see a rough number.':'Add your age in step 1 to see a rough number.'}</p>`;
  return `<div class="est"><span>You'd need about <b>${L(r.corpus)}</b> at ${r.R}</span><span>${r.gap?`Monthly SIP to get there: <b>${inr(r.sip)}</b>`:'You look on track 🎉'}</span><small>Rough guide: 6% inflation, 10% growth before retirement, 7% after. Not guaranteed.</small></div>`}

/* steps */
const STEPS=[
 {t:'You',h:'Hi! Let\'s start with <em>you</em>',lead:'Takes about a minute. Rough answers are perfect.',
  body:()=>`<div class="stack">${F('Your name',`<input class="tx" data-tx="name" value="${esc(V('name')||'')}" placeholder="e.g. Ravi" autocomplete="given-name">`)}
   <div class="two">${F('Age',num('age',32,18,85))}${F('City',`<input class="tx" data-tx="city" value="${esc(V('city')||'')}" placeholder="Hyderabad" autocomplete="address-level2">`)}</div>
   ${F('Work',chips('work',['Salaried','Business','Professional','Retired']))}
   ${F('Yearly income',chips('income',['Under ₹10 L','₹10–25 L','₹25–50 L','₹50 L–1 Cr','₹1 Cr+']),'roughly')}
   <label class="toggle"><input type="checkbox" data-flag="nri" ${V('nri')?'checked':''}> I live outside India (NRI)</label>
   ${V('nri')?F('Country',chips('country',['UAE / Gulf','USA','UK','Canada','Singapore','Other'])):''}</div>`},
 {t:'Family',h:'Who\'s in your <em>family?</em>',lead:'Tap who applies. Skip if you prefer.',skip:1,body:()=>`<div class="stack">${rowsHTML('family')}</div>`},
 {t:'Goals',h:'What do you want to <em>achieve?</em>',lead:'Tap one or more. Each opens just 2–3 quick questions.',body:()=>`<div class="stack">${rowsHTML('goals')}</div>`},
 {t:'Money',h:'Your <em>money</em> today',lead:'Tap what you have, then how much you can invest.',final:1,
  body:()=>`<div class="stack">${rowsHTML('have')}
   ${F('You could invest every month',chips('monthly',['Under ₹10k','₹10–25k','₹25–50k','₹50k+']))}
   ${F('One-time amount available now',chips('lump',['None','Under ₹5 L','₹5–25 L','₹25 L+']))}
   ${V('name')?'':F('Your name',`<input class="tx" data-tx="name" value="" placeholder="So Manoj knows who this is" autocomplete="given-name">`)}
   <label class="consent"><input type="checkbox" id="ok" ${S.ok?'checked':''}> Share these answers with Manoj Kumar (Ashvamedha Finance) on WhatsApp so he can contact me.</label>
   <div class="err" id="err" hidden></div>
   <div><button type="button" class="copy" id="showMsg">WhatsApp not opening? Copy the message</button><textarea id="msg" hidden readonly aria-label="Message"></textarea></div>
   <p class="fine">🔒 Please don't share PAN or account numbers. Nothing is sent until you tap Send. This form is not investment advice. Mutual fund investments are subject to market risks. Insurance is the subject matter of solicitation.</p></div>`}
];

function render(){
  const s=STEPS[S.step];
  $('track').innerHTML=`<div class="rail"><i style="width:${S.step/3*100}%"></i></div>`+STEPS.map((x,i)=>`<button type="button" class="tstep ${i===S.step?'on':''} ${S.done[i]&&i!==S.step?'done':''}" data-go="${i}"><span class="d">${S.done[i]&&i!==S.step?'✓':i+1}</span><span class="t">${x.t}</span></button>`).join('');
  $('stage').innerHTML=`<section class="step"><h1>${s.h}</h1><p class="lead">${s.lead}</p>${s.body()}</section>`;
  $('back').hidden=S.step===0;$('skip').hidden=!s.skip;$('next').hidden=!!s.final;$('send').hidden=!s.final;
  if(s.final)upd();bind();save();
}
function bind(){
  const st=$('stage');
  st.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k,v=b.dataset.v;S.v[k]=V(k)===v?undefined:v;if(k==='kidsN')S.v.kidAges=(V('kidAges')||[]).slice(0,+(V('kidsN')||0));render()});
  st.querySelectorAll('[data-row]').forEach(b=>b.onclick=()=>{const id=b.dataset.row;S.sel[id]=!S.sel[id];render();
    if(S.sel[id])requestAnimationFrame(()=>{const r=b.closest('.row');const y=r.getBoundingClientRect().top+scrollY-140;if(r.getBoundingClientRect().top>innerHeight*0.55)scrollTo({top:y,behavior:'smooth'})})});
  st.querySelectorAll('[data-tx]').forEach(i=>i.oninput=()=>{S.v[i.dataset.tx]=i.value.trim();save();if(STEPS[S.step].final)upd()});
  st.querySelectorAll('input[data-num]').forEach(i=>i.oninput=()=>{const n=parseInt(i.value.replace(/\D/g,''),10);S.v[i.dataset.num]=Number.isFinite(n)?n:undefined;save();refreshEst()});
  st.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{const k=b.dataset.step;let n=V(k)??+b.dataset.def;n=Math.min(+b.dataset.max,Math.max(+b.dataset.min,n+ +b.dataset.d));S.v[k]=n;st.querySelector(`input[data-num="${k}"]`).value=n;save();refreshEst()});
  st.querySelectorAll('[data-kid]').forEach(i=>i.oninput=()=>{const a=V('kidAges')||[];a[+i.dataset.kid]=i.value.replace(/\D/g,'').slice(0,2);S.v.kidAges=a;save()});
  st.querySelectorAll('[data-flag]').forEach(i=>i.onchange=()=>{S.v[i.dataset.flag]=i.checked;render()});
  if($('ok'))$('ok').onchange=()=>{S.ok=$('ok').checked;save();upd()};
  if($('showMsg'))$('showMsg').onclick=async()=>{const t=$('msg');t.value=message();t.hidden=false;try{await navigator.clipboard.writeText(t.value);$('showMsg').textContent='Copied ✓'}catch(e){t.focus();t.select()}};
}
function refreshEst(){const e=$('est');if(e)e.innerHTML=estHTML();const r=document.querySelector('[data-row="retire"] span');if(r&&S.sel.retire)r.textContent=ROWS.goals[0].sum()||ROWS.goals[0].d}

function message(){
  const o=['Hi Manoj 👋 Here\'s my profile from your website.',''];
  const me=[V('name'),V('age')&&V('age')+' yrs',V('city'),V('work'),V('nri')&&('NRI'+(V('country')?' · '+V('country'):''))].filter(Boolean).join(' · ');
  o.push('*About me:* '+(me||'-'));if(V('income'))o.push('Income: '+V('income')+' a year');
  const sect=(title,group)=>{const out=[];ROWS[group].filter(r=>S.sel[r.id]).forEach(r=>{const s=r.sum();out.push('• '+r.t+(s?': '+s:''));if(r.id==='retire'){const x=retire();if(x)out.push(`   Rough need ${L(x.corpus)}${x.gap?`, SIP ≈ ${inr(x.sip)}/mo`:''}`)}});if(out.length)o.push('',`*${title}*`,...out)};
  sect('Family','family');sect('Goals','goals');
  sect('Already have','have');
  const inv=[V('monthly')&&V('monthly')+' a month',V('lump')&&V('lump')!=='None'&&V('lump')+' one-time'].filter(Boolean);
  if(inv.length)o.push('','*Can invest:* '+inv.join(' + '));
  o.push('','Please guide me. [profile]');return o.join('\n');
}
function upd(){const ok=!!(V('name')&&S.ok),a=$('send');a.setAttribute('aria-disabled',ok?'false':'true');a.href=`https://wa.me/${WA}?text=${encodeURIComponent(message())}`;
  const e=$('err');if(e){e.hidden=ok;e.textContent=!V('name')?'Add your name to send.':'Tick the box to send.'}}

function go(i){S.step=Math.max(0,Math.min(3,i));render();scrollTo({top:0,behavior:'smooth'})}
$('next').onclick=()=>{S.done[S.step]=1;go(S.step+1)};
$('skip').onclick=()=>go(S.step+1);
$('back').onclick=()=>go(S.step-1);
$('track').onclick=e=>{const b=e.target.closest('[data-go]');if(b)go(+b.dataset.go)};
$('send').onclick=()=>{try{window.gtag&&gtag('event','profile_sent')}catch(e){}};
render();
})();
</script>
